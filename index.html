<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Bloom Wellness</title>
  <link rel="stylesheet" href="index.css">
</head>
<body class="auth-page">
<header class="site-header"><nav class="navbar" aria-label="Main navigation"><a class="brand" href="home.html"><span class="brand-mark">✿</span> Bloom Wellness</a><div class="nav-links"><a href="home.html">Back to calculator</a></div></nav></header>
<main class="auth-main">
  <section class="auth-card">
    <div class="auth-flower" aria-hidden="true">✿</div><p class="eyebrow">Welcome to your wellness space</p><h1>Come on in</h1>
    <p class="auth-intro">This is a front-end demo form. It does not create or verify an account yet.</p>
    <form id="auth-form">
      <label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
      <label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
      <label for="password">Password</label><input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
      <p id="auth-message" class="form-message" role="status" aria-live="polite"></p><button class="button button-primary auth-submit" type="submit">Create account</button>
    </form>
    <p class="auth-bottom">Just exploring? <a href="home.html">Return to the calculator</a></p>
  </section>
</main>
<footer class="site-footer auth-footer"><p>© 2026 Bloom Wellness</p></footer>
<script>
const authForm = document.getElementById("auth-form");
const authMessage = document.getElementById("auth-message");
authForm.addEventListener("submit", function(event) {
  event.preventDefault();
  if (!authForm.reportValidity()) return;
  authMessage.textContent = "The form looks good! Account creation needs a backend to work.";
  authMessage.classList.add("success-message");
});
</script>
</body>
</html>
